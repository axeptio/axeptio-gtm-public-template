name: Promote develop to master

# Opens the pull request that publishes a release to the GTM Community Template
# Gallery. Google reads metadata.yaml from the DEFAULT branch — master — so
# everything release.yml produces on develop (the tag, the CHANGELOG, the
# metadata.yaml entry) sits there unpublished until this PR is merged.
#
# workflow_dispatch only, and it never merges. Publishing to the gallery is a
# deliberate act: the promotion PR still needs an approval and a human merge, and
# `Validate gallery contract` still has to pass on it first.
#
# The only thing this saves over `gh pr create --base master --head develop` by
# hand is a guaranteed-conventional title and a body that says what is about to
# go live — but the title is a release artifact here (merge_commit_message is
# PR_TITLE), so getting it right without thinking about it is the point.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promote:
    name: Open the promotion PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          # Full history for both branches: the body lists what master..develop
          # contains, which a shallow clone cannot answer.
          fetch-depth: 0
          ref: develop

      - name: Open or refresh the promotion PR
        env:
          # The org forbids the default GITHUB_TOKEN from creating pull requests,
          # which is the same reason release.yml authenticates as the bot.
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          git fetch --quiet origin master develop

          if git diff --quiet origin/master origin/develop; then
            echo "develop and master have identical trees; nothing to promote."
            exit 0
          fi

          # Tags reachable from develop but not from master — the versions this
          # promotion is about to publish. Set difference rather than
          # `--contains`, which would also list a tag sitting exactly on master.
          git tag --merged origin/master | sort > tags-master.txt
          git tag --merged origin/develop | sort > tags-develop.txt
          pending_tags="$(comm -13 tags-master.txt tags-develop.txt | sort -rV | sed 's/^/- /')"
          [ -n "$pending_tags" ] || pending_tags="- (none — no release has been cut since the last promotion)"

          commits="$(git log --no-merges --format='- %s' origin/master..origin/develop)"
          [ -n "$commits" ] || commits="- (none)"

          {
            echo "Promotes \`develop\` to \`master\`, which publishes the versions below to the"
            echo "[GTM Community Template Gallery](https://tagmanager.google.com/gallery). Google polls"
            echo "the repository and picks the new entry up within 2 to 3 days; there is no other"
            echo "publish step."
            echo
            echo "### Versions going live"
            echo
            echo "$pending_tags"
            echo
            echo "### Commits"
            echo
            echo "$commits"
            echo
            echo "---"
            echo
            echo "Merge with a **merge commit**. Do not merge \`master\` back into \`develop\` afterwards —"
            echo "\`Validate commit messages\` would then fail every future promotion PR."
            echo "Generated by \`.github/workflows/promote.yml\`."
          } > body.md

          number="$(gh pr list -R "$REPO" --state open --base master --head develop \
            --json number --jq '.[0].number // empty')"

          if [ -n "$number" ]; then
            gh pr edit "$number" -R "$REPO" --body-file body.md
            echo "Refreshed the open promotion PR #${number}."
          else
            gh pr create -R "$REPO" --base master --head develop \
              --title 'chore(release): promote develop to master' \
              --body-file body.md
          fi
