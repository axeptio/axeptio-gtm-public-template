name: Lint commits

# Enforces Conventional Commits on pull requests. Runs entirely in CI, so
# contributors don't need any local toolchain (no npm install / git hooks).
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    # The PR title is a release artifact, not hygiene. The repo is set to
    # merge_commit_message: PR_TITLE, so GitHub writes the title into the *body*
    # of the merge commit and release-please parses it like any other commit: it
    # adds its own CHANGELOG line, and a PR into develop titled `fix:` cuts a
    # release even when none of its commits do. See docs/release-automation.md.
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@0723387faaf9b38adef4775cd42cfd5155ed6017 # v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            perf
            test
            ci
            build
            revert
          # Scopes are optional; allow any (the commitlint job warns on unknown ones).
          requireScope: false
          # Subject should not start with an uppercase letter.
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. The subject must start with a
            lowercase letter.

  commits:
    # Lints every commit in the PR against commitlint.config.mjs. Useful when a
    # PR is merged with a merge commit rather than squashed.
    name: Validate commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0

      # master is the published branch: a push to it is what puts template.tpl in
      # front of every GTM user who installed the template. Work reaches it by
      # being promoted from develop, never by being merged into it directly, so a
      # PR opened against master by habit is caught here rather than at review.
      #
      # This lives in the `commits` job for the same reason the merge guard below
      # does: `Validate commit messages` is already a required status check on
      # master, so the guard enforces without touching the rulesets.
      #
      # hotfix/* is an escape hatch for repository infrastructure only — a broken
      # workflow that has to be fixed on master before a promotion can run. The
      # same change still has to reach develop, by cherry-pick through a normal
      # PR: merging master back into develop would break every future promotion
      # PR against the guard below.
      - name: Only develop and hotfixes may target master
        if: ${{ github.event.pull_request.base.ref == 'master' }}
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          case "$HEAD_REF" in
            develop | hotfix/*)
              echo "$HEAD_REF may target master."
              ;;
            *)
              echo "Pull requests into master come from develop (a promotion) or hotfix/*." >&2
              echo "This one is from '$HEAD_REF'. Re-target it at develop:" >&2
              echo "  gh pr edit <number> --base develop" >&2
              echo >&2
              echo "master publishes to the GTM Community Template Gallery; develop is" >&2
              echo "where work is integrated and released. See docs/release-automation.md." >&2
              exit 1
              ;;
          esac

      # Merging the base branch INTO a branch makes release-please drop commits from the
      # changelog: its traversal prunes at the merge that pulls already-released
      # history back in. That happened for v1.1.0 — 3 of the 5 commits PR #36
      # landed never reached CHANGELOG.md, and that section becomes the GTM
      # Gallery changeNotes via scripts/update-metadata-version.mjs, so an
      # incomplete section ships an incomplete public description.
      #
      # This lives in the `commits` job rather than a job of its own so it is
      # enforcing straight away: `Validate commit messages` is already a
      # required status check on master and develop.
      #
      # Merges of *other* branches are left alone; only a parent that is already
      # on the base branch trips this. That is what lets a develop -> master
      # promotion PR through: it is made of feature merges whose merged-in
      # parents are feature branches, never commits already on master. The same
      # rule is why master must never be merged back into develop — one such
      # merge would fail every promotion PR from then on.
      #
      # release-please is exempt. Its action keeps the release PR current by
      # merging develop into its own branch every time develop moves, so the
      # guard blocks the release outright — `Validate commit messages` is a
      # required check. The exemption is safe for the reason the guard exists: that branch
      # holds only generated files (VERSION, CHANGELOG.md, the manifest), carries
      # no contributor commits that could be pruned, and its changelog is
      # computed before the merge, not after. Scoped to the bot's own branch so a
      # contributor cannot opt out by naming a branch `release-please--…`.
      #
      # The gallery sync PR is unaffected: release.yml builds
      # `chore/sync-metadata-<tag>` from a fresh develop checkout with a single
      # commit, so it contains no merge commits at all.
      - name: Reject merges of the base branch into the PR branch
        if: "${{ !(github.event.pull_request.user.login == 'axeptio-bot' && startsWith(github.head_ref, 'release-please--')) }}"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          offenders=""
          while IFS= read -r merge; do
            [ -n "$merge" ] || continue
            # Field 1 is the commit itself, field 2 its first parent (the branch
            # it was merged into). Everything after that was merged in.
            for parent in $(git rev-list --parents -n 1 "$merge" | cut -d' ' -f3-); do
              if git merge-base --is-ancestor "$parent" "$BASE_SHA"; then
                offenders="$offenders$merge"$'\n'
                break
              fi
            done
          done < <(git rev-list --merges "$BASE_SHA..$HEAD_SHA")

          if [ -n "$offenders" ]; then
            echo "This branch merges $BASE_REF into itself:"
            printf '%s' "$offenders" | while IFS= read -r merge; do
              git --no-pager log -1 --format='  %h %s' "$merge"
            done
            echo
            echo "Rebase onto $BASE_REF instead:"
            echo "  git fetch origin $BASE_REF && git rebase origin/$BASE_REF"
            echo
            echo "Merging $BASE_REF in makes release-please prune commits from the"
            echo "changelog, and that changelog is published as the template's"
            echo "release notes in the GTM Community Template Gallery."
            exit 1
          fi

          echo "No $BASE_REF merges in this branch."

      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          configFile: commitlint.config.mjs
