name: Release

# Drives Semantic Versioning from Conventional Commits. On every push to
# develop, release-please maintains a "release PR". Merging that PR bumps
# VERSION, updates CHANGELOG.md, tags the commit and publishes a GitHub Release.
# A follow-up step then appends the new version to the GTM metadata.yaml history.
#
# Everything here happens on develop. Nothing it produces reaches the gallery on
# its own: Google reads metadata.yaml from the DEFAULT branch, which is master,
# so a release is published only once someone promotes develop to master. See
# docs/release-automation.md.
#
# Why not the canonical axeptio/tech-scripts caller workflows (ENG-11756)?
# This repository is PUBLIC and tech-scripts is INTERNAL. GitHub only lets a
# public caller repository use reusable workflows from PUBLIC repositories, so
# those callers could never run here — they failed at access time with
# "workflow was not found". release-please-action is a public action, so it has
# no such restriction. See docs/release-automation.md.
on:
  push:
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Authenticate as axeptio-bot (BOT_GITHUB_TOKEN). The org forbids the
      # default GITHUB_TOKEN from creating or approving PRs, which is what broke
      # the original release-please run (#37) — a real bot account is allowed to,
      # and may bypass the PR requirement when pushing the metadata sync commit.
      #
      # target-branch is pinned rather than left to default. It defaults to the
      # repository's DEFAULT branch — master, which the gallery contract requires
      # it to stay — so the fallback would open the release PR against the branch
      # this flow releases *to*, not the one it releases *from*. Leaving it to the
      # default is what silently mis-targeted the release PR the last time this
      # repository had two long-lived branches.
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: develop
          token: ${{ secrets.BOT_GITHUB_TOKEN }}

      # Is there an open release PR carrying an unsigned commit?
      #
      # Deliberately NOT keyed on steps.release.outputs.pr. That output is only
      # set when release-please creates or updates a PR *in this run*, so an
      # already-open PR that needs no update — every push of a non-releasing
      # `ci`/`docs`/`chore` commit — leaves it empty and the signing step never
      # fires. An unsigned release PR would then stay unsigned forever, which is
      # exactly what happened to #79 on 592fa3c.
      #
      # Runs before the checkout on purpose: `gh` needs neither a working tree
      # nor a git repo, so this stays cheap on the runs where there is nothing
      # to do. No output means no checkout and no GPG import.
      - name: Detect an unsigned release PR
        id: relpr
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BASE: develop
        run: |
          set -euo pipefail
          # Matched on all three of author, base and branch prefix — the same
          # belt-and-braces pattern commitlint.yml uses for its exemption. The
          # signing step force-pushes whatever this selects, so a branch merely
          # NAMED release-please--… must not be enough to have someone's work
          # replaced by develop plus three generated files.
          number="$(gh pr list -R "$REPO" --state open --base "$BASE" \
            --json number,headRefName,author \
            --jq 'map(select(.author.login == "axeptio-bot")
                    | select(.headRefName | startswith("release-please--")))
                  | .[0].number // empty')"

          if [ -z "$number" ]; then
            echo "No open release PR authored by axeptio-bot against ${BASE}."
            exit 0
          fi

          # Skip when every commit is already verified, so a signed branch is
          # not force-pushed (and its checks re-run) on every push to develop.
          signed="$(gh api "repos/$REPO/pulls/$number/commits" \
            --jq '[.[].commit.verification.verified] | all')"
          if [ "$signed" = "true" ]; then
            echo "Release PR #${number} is already fully signed."
            exit 0
          fi

          # Only the branch name is exported. The commit subject is read from
          # git after the checkout instead of from the PR title, which is free
          # text and would need escaping to be safe in GITHUB_OUTPUT.
          branch="$(gh pr view "$number" -R "$REPO" --json headRefName --jq '.headRefName')"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          echo "Release PR #${number} (${branch}) has unsigned commits; will re-sign."

      # The steps below run when a release was just published, when an open
      # release PR needs signing, or both.
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        if: ${{ steps.release.outputs.release_created == 'true' || steps.relpr.outputs.branch != '' }}
        with:
          # Use the bot token so the follow-up push authenticates as the bot
          # (and can bypass branch protection on develop).
          token: ${{ secrets.BOT_GITHUB_TOKEN }}
          # Full history: the release-PR signing step below replays the
          # generated files onto develop and needs both branches.
          fetch-depth: 0

      # Import the bot's GPG key so the metadata commit is signed — develop
      # enforces signed commits (the Compliance ruleset covers both branches). Also sets git user.name/email from the key
      # identity and enables commit signing globally.
      - name: Import bot GPG key
        if: ${{ steps.release.outputs.release_created == 'true' || steps.relpr.outputs.branch != '' }}
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
        with:
          gpg_private_key: ${{ secrets.BOT_GPG_PRIVATE_KEY }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: ${{ steps.release.outputs.release_created == 'true' }}
        with:
          node-version-file: .nvmrc

      # The only way anyone outside this repository can get at a version before the
      # gallery serves it. The gallery follows master and then lags a further two to
      # three days, so between a release being cut on develop and its promotion
      # there was no artifact for QA or a customer to test at all.
      #
      # Deliberately a release asset rather than a branch URL. template.tpl is
      # already fetchable from raw.githubusercontent.com - the repository is public -
      # but that URL moves under the reader, so "QA tested it" names no version. This
      # one is immutable and says which build it is in its filename.
      #
      # Runs before the metadata sync PR, not after: the sync PR is the slow,
      # human-gated step, and there is no reason for the download to wait on it.
      - name: Attach the template to the release
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          asset="axeptio-cmp-${RELEASE_TAG}.tpl"
          cp template.tpl "$asset"
          # --clobber because re-running this job is the documented recovery path
          # for the steps below it, and an upload that failed the second time would
          # block that recovery over an artifact that is byte-identical anyway.
          gh release upload "$RELEASE_TAG" "$asset" --clobber
          rm -f "$asset"
          echo "Attached ${asset} to ${RELEASE_TAG}."

      - name: Sync metadata.yaml version history
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: node scripts/update-metadata-version.mjs

      # Opens a pull request rather than pushing straight to develop. A direct
      # push cannot work: `Validate gallery contract` is a required status
      # check, and bypass_pull_request_allowances only exempts the bot from the
      # REVIEW requirement, not from status checks — a direct push carries no
      # check run, so the branch rejects it with
      #   GH006 - Required status check "Validate gallery contract" is expected.
      # That silently stopped v2.0.1 reaching the gallery.
      #
      # Going through a PR is also better than the push it replaces: the
      # generated entry is now validated before it lands, which never happened
      # when the bot pushed directly.
      - name: Open the metadata.yaml sync PR
        if: ${{ steps.release.outputs.release_created == 'true' }}
        # RELEASE_TAG goes through env rather than being interpolated straight
        # into the script: never expand ${{ }} inside a run: block.
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: |
          if [[ -z "$(git status --porcelain metadata.yaml)" ]]; then
            echo "metadata.yaml already up to date; nothing to do."
            exit 0
          fi

          # Every step below is idempotent, because re-running this job is the
          # expected recovery path: if auto-merge does not complete on its own,
          # someone re-runs the workflow after merging or fixing the PR. A
          # non-idempotent version would fail on the second attempt with a
          # non-fast-forward push or "a pull request already exists".
          #
          # (The already-synced case needs no handling here: on a re-run the
          # checkout is fresh from develop, so update-metadata-version.mjs finds
          # the sha present, writes nothing, and the guard above exits 0.)
          branch="chore/sync-metadata-${RELEASE_TAG}"
          git checkout -B "$branch"
          git add metadata.yaml
          git commit -m "chore(metadata): sync version history for ${RELEASE_TAG}"

          # The branch only ever holds this one generated commit, rebuilt from
          # the release commit each run, so replacing it wholesale is correct.
          git push --force-with-lease origin "$branch"

          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            echo "Sync PR for ${RELEASE_TAG} already exists; updated its branch."
          else
            gh pr create --base develop --head "$branch" \
              --title "chore(metadata): sync version history for ${RELEASE_TAG}" \
              --body "Stages ${RELEASE_TAG} for the GTM Community Template Gallery by appending the released commit to \`metadata.yaml\`. It reaches the gallery when develop is promoted to master. Generated by \`scripts/update-metadata-version.mjs\`; do not edit by hand."
          fi

          # Auto-merge rather than merging outright, so the contract check has
          # to pass first. Whether this then completes unattended depends on
          # the bot's bypass covering its own approval — if it does not, the PR
          # stays open for a one-click merge, which is visible and recoverable.
          # Enabling auto-merge twice is not an error worth failing the job for.
          gh pr merge "$branch" --merge --auto --delete-branch || \
            echo "Could not enable auto-merge; the sync PR is open and needs a manual merge."

      # release-please authenticates with a PAT, and the release commit it
      # creates through the API is NOT signed. The Compliance ruleset requires
      # verified signatures on master AND develop and has NO bypass actor, so an
      # unsigned commit makes the release PR unmergeable by anyone — including
      # an admin. That blocked v2.1.3.
      #
      # v2.1.2 shipped only because classic branch protection still granted
      # admins an implicit bypass. Migrating master to rulesets (gtm-3od)
      # removed it, which is correct — rulesets have no implicit admin bypass —
      # and this is simply the first release to meet the rule as written.
      #
      # Adding the bot to the Compliance ruleset's bypass is NOT the fix: bypass
      # is per-RULESET, not per-rule, so it would also exempt the bot from
      # required_status_checks and undo the guarantee that the sync PR cannot
      # merge while the gallery contract check is failing.
      #
      # Instead, rebuild the release PR branch as a single commit signed with
      # the bot's GPG key — the same key and the same checkout-B-and-force-push
      # pattern the sync PR above already uses. The branch only ever carries
      # three generated files and release-please rewrites it from scratch on
      # every run, so replacing it wholesale is safe. Replaying onto develop also
      # drops the "Merge branch 'develop' into release-please--…" commits the
      # action leaves behind.
      #
      # Runs last so the metadata steps above still see a checkout of develop,
      # and is gated on the detector at the top of the job rather than on
      # release-please's own output — see the comment there.
      - name: Sign the release PR commit
        if: ${{ steps.relpr.outputs.branch != '' }}
        env:
          RELEASE_BRANCH: ${{ steps.relpr.outputs.branch }}
        run: |
          set -euo pipefail
          branch="$RELEASE_BRANCH"

          git fetch --quiet origin develop "$branch"
          before="$(git rev-parse "origin/$branch")"

          # Reuse release-please's own subject rather than the PR title: the
          # title is free text, while this is the commit the action wrote. The
          # oldest non-merge commit on the branch is the release commit.
          title="$(git log --format=%s --no-merges "origin/develop..origin/$branch" | tail -1)"
          if [ -z "$title" ]; then
            echo "No release commit found on $branch; nothing to sign." >&2
            exit 1
          fi

          git checkout -B "$branch" origin/develop
          git checkout "origin/$branch" -- \
            VERSION CHANGELOG.md .release-please-manifest.json

          if git diff --cached --quiet; then
            echo "Release PR branch matches develop; nothing to sign."
            exit 0
          fi

          git commit -S -m "$title"

          # Idempotent: on a re-run the branch is rebuilt from the same inputs.
          # --force-with-lease pinned to the SHA read above, so a concurrent
          # release-please update is rejected rather than silently discarded.
          git push --force-with-lease="$branch:$before" origin "HEAD:refs/heads/$branch"
          echo "Re-signed $branch as $(git rev-parse --short HEAD)."
