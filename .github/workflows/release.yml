name: Release

# Drives Semantic Versioning from Conventional Commits. On every push to
# master, release-please maintains a "release PR". Merging that PR bumps
# VERSION, updates CHANGELOG.md, tags the commit and publishes a GitHub Release.
# A follow-up step then appends the new version to the GTM metadata.yaml history.
#
# Why not the canonical axeptio/tech-scripts caller workflows (ENG-11756)?
# This repository is PUBLIC and tech-scripts is INTERNAL. GitHub only lets a
# public caller repository use reusable workflows from PUBLIC repositories, so
# those callers could never run here — they failed at access time with
# "workflow was not found". release-please-action is a public action, so it has
# no such restriction. See docs/release-automation.md.
on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Authenticate as axeptio-bot (BOT_GITHUB_TOKEN). The org forbids the
      # default GITHUB_TOKEN from creating or approving PRs, which is what broke
      # the original release-please run (#37) — a real bot account is allowed to,
      # and may bypass the PR requirement when pushing the metadata sync commit.
      #
      # target-branch is intentionally omitted: it defaults to the repository's
      # default branch, which is master — the same branch this workflow triggers
      # on. (It had to be set explicitly while develop was the default branch,
      # otherwise release-please opened its release PR against develop.)
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.BOT_GITHUB_TOKEN }}

      # The steps below only run when a release was just published.
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        if: ${{ steps.release.outputs.release_created == 'true' }}
        with:
          # Use the bot token so the follow-up push authenticates as the bot
          # (and can bypass branch protection on master).
          token: ${{ secrets.BOT_GITHUB_TOKEN }}

      # Import the bot's GPG key so the metadata commit is signed — master
      # enforces signed commits. Also sets git user.name/email from the key
      # identity and enables commit signing globally.
      - name: Import bot GPG key
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
        with:
          gpg_private_key: ${{ secrets.BOT_GPG_PRIVATE_KEY }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: ${{ steps.release.outputs.release_created == 'true' }}
        with:
          node-version: 20

      - name: Sync metadata.yaml version history
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: node scripts/update-metadata-version.mjs

      # Opens a pull request rather than pushing straight to master. A direct
      # push cannot work: `Validate gallery contract` is a required status
      # check, and bypass_pull_request_allowances only exempts the bot from the
      # REVIEW requirement, not from status checks — a direct push carries no
      # check run, so the branch rejects it with
      #   GH006 - Required status check "Validate gallery contract" is expected.
      # That silently stopped v2.0.1 reaching the gallery.
      #
      # Going through a PR is also better than the push it replaces: the
      # generated entry is now validated before it lands, which never happened
      # when the bot pushed directly.
      - name: Open the metadata.yaml sync PR
        if: ${{ steps.release.outputs.release_created == 'true' }}
        # RELEASE_TAG goes through env rather than being interpolated straight
        # into the script: never expand ${{ }} inside a run: block.
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: |
          if [[ -z "$(git status --porcelain metadata.yaml)" ]]; then
            echo "metadata.yaml already up to date; nothing to do."
            exit 0
          fi

          # Every step below is idempotent, because re-running this job is the
          # expected recovery path: if auto-merge does not complete on its own,
          # someone re-runs the workflow after merging or fixing the PR. A
          # non-idempotent version would fail on the second attempt with a
          # non-fast-forward push or "a pull request already exists".
          #
          # (The already-published case needs no handling here: on a re-run the
          # checkout is fresh from master, so update-metadata-version.mjs finds
          # the sha present, writes nothing, and the guard above exits 0.)
          branch="chore/sync-metadata-${RELEASE_TAG}"
          git checkout -B "$branch"
          git add metadata.yaml
          git commit -m "chore(metadata): sync version history for ${RELEASE_TAG}"

          # The branch only ever holds this one generated commit, rebuilt from
          # the release commit each run, so replacing it wholesale is correct.
          git push --force-with-lease origin "$branch"

          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            echo "Sync PR for ${RELEASE_TAG} already exists; updated its branch."
          else
            gh pr create --base master --head "$branch" \
              --title "chore(metadata): sync version history for ${RELEASE_TAG}" \
              --body "Publishes ${RELEASE_TAG} to the GTM Community Template Gallery by appending the released commit to \`metadata.yaml\`. Generated by \`scripts/update-metadata-version.mjs\`; do not edit by hand."
          fi

          # Auto-merge rather than merging outright, so the contract check has
          # to pass first. Whether this then completes unattended depends on
          # the bot's bypass covering its own approval — if it does not, the PR
          # stays open for a one-click merge, which is visible and recoverable.
          # Enabling auto-merge twice is not an error worth failing the job for.
          gh pr merge "$branch" --merge --auto --delete-branch || \
            echo "Could not enable auto-merge; the sync PR is open and needs a manual merge."
