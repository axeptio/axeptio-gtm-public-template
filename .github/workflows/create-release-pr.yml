name: Create Release PR

# Runs on a schedule and on demand.
on:
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 08:00 UTC
  workflow_dispatch:

concurrency:
  group: create-release-pr-${{ github.repository }}
  cancel-in-progress: false

jobs:
  create-release-pr:
    # Requires .github/release-automation-enabled to exist in this repo.
    uses: axeptio/tech-scripts/.github/workflows/create-release-pr.yml@master
    with:
      source_branch: develop      # branch with accumulated commits
      target_branch: master       # branch to release into
    secrets:
      BOT_GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
      BOT_GPG_PRIVATE_KEY: ${{ secrets.BOT_GPG_PRIVATE_KEY }}
      BOT_EMAIL: ${{ secrets.BOT_EMAIL }}
