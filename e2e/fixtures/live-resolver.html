<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Axeptio GTM template — live geolocation resolver fixture</title>
</head>
<body>
  <!--
    Loaded by e2e/live-container.spec.mjs against the real CI container.

    The FILENAME is part of the contract: the container's trigger fires on
    "Page Path contains live-resolver". Renaming this file silently stops the tag
    firing, and the symptom is an absent banner rather than a 404.

    The tag behind this page carries the same Axeptio project as live-brands.html
    — the CI project holds both a Brands and a TCF configuration — but with
    "Let Axeptio pick the configuration from the visitor's location" ticked and no
    Cookies Version set. So nothing here decides which banner appears: the real
    geolocation service does, from the runner's own IP. What the suite asserts is
    therefore structural — see the resolver test in live-container.spec.mjs.

    Unlike the hermetic harness, nothing here is stubbed. GTM is fetched from
    googletagmanager.com, it evaluates the real compiled template, that injects the
    real geolocation script from headless-api.axeptio.tech, and its callback
    injects the genuine SDK from static.axept.io.
  -->
  <h1>Live geolocation resolver fixture</h1>
  <p>Container <code>__GTM_PUBLIC_ID__</code>, resolver tag, real Axeptio SDK.</p>

  <!-- Google Tag Manager -->
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','__GTM_PUBLIC_ID__');</script>
  <!-- End Google Tag Manager -->
</body>
</html>
